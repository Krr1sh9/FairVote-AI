[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairvote-ai"
version = "0.1.0"
description = "A reproducible evaluation of Randomised Response and poststratification for privacy-preserving polling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Krrish Shah" }]
keywords = [
    "local-differential-privacy",
    "randomised-response",
    "poststratification",
    "polling",
]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
experiments = [
    "pandas>=2.0,<4",
    "matplotlib>=3.7,<4",
]
app = [
    "pandas>=2.0,<4",
    "streamlit>=1.30,<2",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["fairvote*", "experiments*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "statistical: fixed-seed checks of stochastic behaviour with loose tolerances",
]

[tool.coverage.run]
branch = true
source = ["fairvote", "experiments"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["results", "**/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
